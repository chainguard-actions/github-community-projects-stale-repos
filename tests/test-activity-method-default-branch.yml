name: Test ACTIVITY_METHOD=default_branch_updated
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: stale-repos
        name: Run stale-repos with default_branch_updated activity method
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          INACTIVE_DAYS: 36500
          ORGANIZATION: github-community-projects
          ACTIVITY_METHOD: "default_branch_updated"
          SKIP_EMPTY_REPORTS: "false"

      - name: Assert inactiveRepos output is valid JSON or empty
        env:
          ACTUAL: ${{ steps.stale-repos.outputs.inactiveRepos }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "PASS: output is empty (no stale repos with 36500 day threshold)"
          else
            echo "$ACTUAL" | python3 -c "import sys, json; data = json.load(sys.stdin); assert isinstance(data, list), 'Expected a list'" && \
              echo "PASS: inactiveRepos is a valid JSON array" || \
              { echo "FAIL: inactiveRepos is not a valid JSON array"; exit 1; }
          fi
