name: Test basic usage - stale repos with token owner repos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          INACTIVE_DAYS: "1"
          SKIP_EMPTY_REPORTS: "false"
      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INACTIVE_REPOS: ${{ steps.action.outputs.inactiveRepos }}
        run: |
          echo "outcome: $OUTCOME"
          echo "inactiveRepos: $INACTIVE_REPOS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
