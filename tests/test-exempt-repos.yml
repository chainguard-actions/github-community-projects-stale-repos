name: Test exempt repos configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: stale-repos
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          INACTIVE_DAYS: "1"
          ORGANIZATION: "github-community-projects"
          EXEMPT_REPOS: "*"
          ACTIVITY_METHOD: "pushed"
          SKIP_EMPTY_REPORTS: "false"

      - name: Assert action completed with all repos exempt
        env:
          ACTUAL: ${{ steps.stale-repos.outputs.inactiveRepos }}
        run: |
          echo "actual: $ACTUAL"
          # With EXEMPT_REPOS=*, all repos are exempt so output should be empty array
          if [ -z "$ACTUAL" ]; then
            echo "PASS: output is empty string"
            exit 0
          fi
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ "$NORM" = "[]" ] || [ "$NORM" = "null" ]; then
            echo "PASS: output is empty JSON array or null (all repos exempt)"
            exit 0
          fi
          echo "$ACTUAL" | python3 -c "import sys, json; data = json.load(sys.stdin); print('PASS: valid JSON with', len(data), 'items')" || {
            echo "FAIL: output is not valid JSON: $ACTUAL"
            exit 1
          }
          echo "PASS"
