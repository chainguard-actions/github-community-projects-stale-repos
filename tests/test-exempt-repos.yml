name: Test exempt repos configuration
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: stale-repos
        name: Run stale-repos action with exempt repos
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || 'dummy-token-for-act' }}
          INACTIVE_DAYS: "365"
          ORGANIZATION: "github-community-projects"
          EXEMPT_REPOS: "stale-repos,test-repo,conf-*"
          SKIP_EMPTY_REPORTS: "false"

      - name: Check action outcome and validate output if successful
        env:
          OUTCOME: ${{ steps.stale-repos.outcome }}
          INACTIVE_REPOS: ${{ steps.stale-repos.outputs.inactiveRepos }}
        run: |
          echo "Action outcome: $OUTCOME"
          echo "inactiveRepos output: $INACTIVE_REPOS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$INACTIVE_REPOS" ]; then
              echo "FAIL: action succeeded but inactiveRepos output is empty"
              exit 1
            fi
            echo "$INACTIVE_REPOS" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if not isinstance(data, list):
              print('FAIL: expected a JSON array')
              sys.exit(1)
          print('Parsed', len(data), 'repos (may be 0 if none are stale)')
          print('PASS: valid JSON array')
          "
            echo "$INACTIVE_REPOS" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          exempt = ['stale-repos', 'test-repo']
          for repo in data:
              url = repo.get('url', '')
              repo_name = url.rstrip('/').split('/')[-1]
              if repo_name in exempt:
                  print(f'FAIL: exempt repo {repo_name} found in output')
                  sys.exit(1)
          print('PASS: no exempt repos found in output')
          "
          else
            echo "Action did not succeed (likely missing GH_TOKEN in act environment) - skipping output validation"
            echo "PASS: action ran (outcome=$OUTCOME, acceptable in act without real token)"
          fi
