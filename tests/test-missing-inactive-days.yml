name: Test missing INACTIVE_DAYS fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Assert action failed due to missing INACTIVE_DAYS
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when INACTIVE_DAYS is not set"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without INACTIVE_DAYS"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
