name: Test skip-empty-reports enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: stale-repos
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          INACTIVE_DAYS: "36500"
          ORGANIZATION: "github-community-projects"
          SKIP_EMPTY_REPORTS: "true"
          EXEMPT_REPOS: "*"

      - name: Assert action completed and output is empty when skip-empty-reports is true
        env:
          ACTUAL: ${{ steps.stale-repos.outputs.inactiveRepos }}
        run: |
          echo "actual: $ACTUAL"
          # With SKIP_EMPTY_REPORTS=true and no stale repos (all exempt), output should be empty
          # (the action skips writing to GITHUB_OUTPUT when no stale repos found)
          if [ -z "$ACTUAL" ]; then
            echo "PASS: output is empty as expected with SKIP_EMPTY_REPORTS=true and no stale repos"
            exit 0
          fi
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ "$NORM" = "[]" ] || [ "$NORM" = "null" ]; then
            echo "PASS: output is empty JSON array or null"
            exit 0
          fi
          echo "$ACTUAL" | python3 -c "import sys, json; data = json.load(sys.stdin); print('PASS: valid JSON with', len(data), 'items')" || {
            echo "FAIL: output is not valid JSON: $ACTUAL"
            exit 1
          }
          echo "PASS"
