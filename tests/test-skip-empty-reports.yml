name: Test skip empty reports - no stale repos found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          INACTIVE_DAYS: "99999"
          SKIP_EMPTY_REPORTS: "true"
      - name: Assert action ran successfully or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INACTIVE_REPOS: ${{ steps.action.outputs.inactiveRepos }}
        run: |
          echo "outcome: $OUTCOME"
          echo "inactiveRepos: $INACTIVE_REPOS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with skip_empty_reports=true"
            # With INACTIVE_DAYS=99999, no repos should be stale, so inactiveRepos should be empty
            if [ -n "$INACTIVE_REPOS" ]; then
              echo "INFO: inactiveRepos output is set: $INACTIVE_REPOS"
            else
              echo "INFO: inactiveRepos output is empty (expected when no stale repos found)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
