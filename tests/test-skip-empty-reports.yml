name: Test skip-empty-reports behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ORGANIZATION: actions
          INACTIVE_DAYS: "99999"
          SKIP_EMPTY_REPORTS: "true"

      - name: Assert action ran with skip-empty-reports or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INACTIVE_REPOS: ${{ steps.action.outputs.inactiveRepos }}
        run: |
          echo "outcome: $OUTCOME"
          echo "inactiveRepos: $INACTIVE_REPOS"
          if [ "$OUTCOME" = "success" ]; then
            # With SKIP_EMPTY_REPORTS=true and a very high threshold,
            # inactiveRepos output may be empty (no stale repos found, report skipped)
            # or may contain repos if some are truly that old
            echo "PASS: action succeeded with skip-empty-reports enabled"
            echo "inactiveRepos value: '$INACTIVE_REPOS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API call may not be possible under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
